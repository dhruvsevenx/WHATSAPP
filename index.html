<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTER$EXCH - India's Most Trusted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .font-heading {
            font-family: 'Oswald', sans-serif;
        }
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translateX(-50%) translateY(-50%);
            background-size: cover;
            filter: blur(4px) brightness(0.4);
        }
        .logo-dp {
            /* Made slightly smaller for better mobile view */
            width: 120px;
            height: 120px;
            border: 4px solid #FFC700;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 20px rgba(255, 199, 0, 0.6);
        }
        /* Increase size on larger screens */
        @media (min-width: 640px) {
            .logo-dp {
                width: 150px;
                height: 150px;
                border-width: 5px;
            }
        }
        .cta-button {
            background: linear-gradient(180deg, #25D366 0%, #128C7E 100%);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
        }
        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }
        .glow-text {
            text-shadow: 0 0 8px rgba(255, 199, 0, 0.8), 0 0 10px rgba(255, 199, 0, 0.6);
        }
    </style>
</head>
<body class="bg-black text-white">

    <video autoplay muted loop id="bg-video">
        <source src="https://videos.pexels.com/video-files/3209828/3209828-hd_1920_1080_25fps.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="relative min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-center">
        
        <!-- CTA Button at the Top -->
        <!-- Responsive text and padding for the button -->
        <a href="#" class="cta-button flex items-center justify-center text-white font-bold text-xl sm:text-2xl py-3 px-8 sm:py-4 sm:px-12 rounded-full w-full max-w-sm mb-8">
            <i class="fab fa-whatsapp text-3xl sm:text-4xl mr-3"></i>
            CLICK HERE 
        </a>

        <!-- DP Style Logo -->
        <div class="logo-dp rounded-full flex items-center justify-center mb-4">
            <!-- Responsive text for logo initial -->
            <h1 class="text-white font-heading text-5xl sm:text-6xl glow-text">P$E</h1>
        </div>
        
        <!-- Brand Name -->
        <!-- Responsive text for brand name -->
        <h2 class="font-heading text-4xl sm:text-6xl tracking-widest text-white uppercase glow-text mb-2">PUNTER<span class="text-yellow-400">$</span>EXCH</h2>
        <p class="text-yellow-400 font-semibold tracking-wider border-2 border-yellow-400 rounded-full px-4 py-1 inline-block text-sm sm:text-base">INDIA'S MOST TRUSTED EXCHANGE</p>

        <!-- Footer -->
        <div class="absolute bottom-4 text-xs text-gray-400 px-2">
            <p>&copy; 2025 PUNTER$EXCH. All Rights Reserved.</p>
            <p>18+ Only</p>
        </div>
    </div>

</body>
</html>
